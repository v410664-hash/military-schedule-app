name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Gradle Environment
        run: |
          mkdir -p ~/.config/flet
          echo '{"android": {"skipDependencyValidation": true}}' > ~/.config/flet/config.json
          export FLET_ANDROID_SKIP_DEPENDENCY_VALIDATION=true
          echo "FLET_ANDROID_SKIP_DEPENDENCY_VALIDATION=true" >> $GITHUB_ENV

      - name: Build Android APK
        run: |
          flet build apk -- --android-skip-build-dependency-validation
      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: military-schedule-apk
          path: build/apk/*.apk
